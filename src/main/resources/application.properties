spring.application.name=prueba
server.port=${PORT:8080}

# 1. URL de JDBC obligatoria para que Hibernate sepa a dónde conectarse
spring.datasource.url=jdbc:mysql:///${DB_NAME:prueba}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Propiedades de Cloud SQL para el Socket Factory (las que ya tenías)
spring.cloud.gcp.sql.database-name=${DB_NAME:prueba}
spring.cloud.gcp.sql.instance-connection-name=${DB_INSTANCE_CONNECTION_NAME}

# 3. Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect