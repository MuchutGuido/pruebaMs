spring.application.name=prueba
server.port=${PORT:8080}

# Por defecto, si ejecutas en IntelliJ, usará el perfil 'local'
#spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Propiedades nativas requeridas por el Starter de Google Cloud SQL
spring.cloud.gcp.sql.instance-connection-name=${INSTANCE_CONNECTION_NAME}
spring.cloud.gcp.sql.database-name=${DB_NAME}

# Configuración híbrida de la Base de Datos
# Si estás en la nube usará las variables de GCP. Si estás en tu PC, usará los valores después del ":"
spring.datasource.url=jdbc:mysql://google/${DB_NAME}?socketFactory=com.google.cloud.sql.mysql.SocketFactory&cloudSqlInstance=${INSTANCE_CONNECTION_NAME}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
