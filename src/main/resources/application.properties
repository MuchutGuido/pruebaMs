spring.application.name=prueba
server.port=${PORT:8080}

#Credenciales de base de datos
spring.datasource.username=${DB_USER:gem}
spring.datasource.password=${DB_PASS}

# 2. Las propiedades de GCP por las que preguntaste al principio
spring.cloud.gcp.sql.database-name=${DB_NAME:prueba}
spring.cloud.gcp.sql.instance-connection-name=${DB_INSTANCE_CONNECTION_NAME}

# 3. Hibernate opcional
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
