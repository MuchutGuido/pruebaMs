spring.application.name=prueba
server.port=${PORT:8080}

# El Starter de Google lee esto y arma la URL y el Driver de forma automática en la nube
spring.cloud.gcp.sql.instance-connection-name=${INSTANCE_CONNECTION_NAME}
spring.cloud.gcp.sql.database-name=${DB_NAME}

# Credenciales (Híbridas: toman las variables de GCP o 'root' por defecto local)
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# Configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
