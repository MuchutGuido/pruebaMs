# URL de conexión
spring.datasource.url=jdbc:mysql://localhost:3306/prueba?serverTimezone=UTC&useSSL=false

# Tus credenciales de MySQL
spring.datasource.username=root
spring.datasource.password=root

# Driver de MySQL 8.x / 9.x
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- AGREGÁ ESTAS LÍNEAS PARA SOLUCIONAR EL ERROR ---
# Desactiva el conector de Google Cloud SQL localmente
spring.autoconfigure.exclude=com.google.cloud.spring.autoconfigure.secretmanager.GcpSecretManagerAutoConfiguration
spring.cloud.gcp.sql.enabled=false
# Evita que busque credenciales de GCP en tu disco
spring.cloud.gcp.core.enabled=false